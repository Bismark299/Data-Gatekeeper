kind = "web"
previewPath = "/"
title = "Data Bundle Platform"
version = "1.0.0"
id = "artifacts/data-bundle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20718

[services.development]
run = "pnpm --filter @workspace/data-bundle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-bundle", "run", "build" ]
publicDir = "artifacts/data-bundle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20718"
BASE_PATH = "/"
