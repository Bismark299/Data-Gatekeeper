        pendingOrders:
          type: integer
        completedOrders:
          type: integer
        recentUsers:
          type: integer
        recentOrders:
          type: integer
      required:
        - totalUsers
        - totalOrders
        - totalRevenue
        - activeBundles
        - pendingOrders
        - completedOrders
        - recentUsers
        - recentOrders

    RevenuePoint:
      type: object
      properties:
